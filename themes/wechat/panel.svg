<?xml version="1.0" encoding="UTF-8"?>
<!-- 候选面板圆角背景（九宫格）。圆角半径 14px，与 theme.conf 中
     [InputPanel/Background/Margin] 的 14px 边界一致，圆角不会被拉伸变形。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="55" height="55" rx="14" ry="14"
        fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1" filter="url(#shadow)"/>
</svg>
