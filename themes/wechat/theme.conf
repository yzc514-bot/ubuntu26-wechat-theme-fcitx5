[Metadata]
Name=WeChat
Name[zh_CN]=微信
Version=1
Author=ubuntu26
Description=WeChat-inspired light theme for fcitx5 (green accent, rounded panel)
Description[zh_CN]=仿微信浅色主题：微信绿选中态、圆角候选面板
ScaleWithDPI=True

[InputPanel]
# 候选词字体（系统已装 Noto Sans CJK，回退到通用 sans）
Font=Noto Sans CJK SC 14
# 普通候选词颜色：微信正文色 #353535
NormalColor=#353535
# 预编辑（拼音串）颜色：微信绿 #07C160
HighlightColor=#07C160
# 预编辑背景：浅绿 #E8F7ED
HighlightBackgroundColor=#E8F7ED
# 选中候选词文字颜色：白 #FFFFFF
HighlightCandidateColor=#FFFFFF
# 序号标签颜色：微信次要文字色 #888888
CandidateLabelColor=#888888
# 选中态序号标签颜色：白 #FFFFFF
HighlightCandidateLabelColor=#FFFFFF
# 候选注释（拼音/英文）颜色：#888888
CandidateCommentColor=#888888
# 选中态注释颜色：白色半透明
HighlightCandidateCommentColor=#D9F2E4
# 序号字号比例（%）
LabelTextSizeFactor=80
# 注释字号比例（%）
CommentTextSizeFactor=75
# 垂直候选列表时高亮占满整行宽度
FullWidthHighlight=True
# 翻页按钮垂直对齐
PageButtonAlignment=Center

[InputPanel/TextMargin]
# 候选词距面板左右内边距
Left=10
Right=10
# 候选词距面板上下内边距
Top=6
Bottom=6

[InputPanel/ContentMargin]
# 面板内所有内容的额外外边距
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/Background]
# 圆角面板背景图（SVG 九宫格拉伸，圆角不会被拉伸变形）
Image=panel.svg
# 无图片时生效的兜底颜色
Color=#FFFFFF
# 边框颜色：微信分割线 #E5E5E5
BorderColor=#E5E5E5
# 边框宽度
BorderWidth=1

[InputPanel/Background/Margin]
# 九宫格边界：与 panel.svg 的圆角半径一致，保证圆角保形
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/Highlight]
# 选中候选的绿底圆角背景
Image=highlight.svg
# 兜底颜色：微信绿 #07C160
Color=#07C160
# 选中态无边框
BorderColor=#00000000
BorderWidth=0

[InputPanel/Highlight/Margin]
# 高亮九宫格边界：与 highlight.svg 的圆角半径（8px）严格一致，
# 否则九宫格拉伸时上下边不足承载垂直圆角，会导致高亮块变形。
Left=8
Right=8
Top=8
Bottom=8

[InputPanel/HighlightClickMargin]
# 高亮区域可点击范围
Left=3
Right=3
Top=1
Bottom=1

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/NextPage]
Image=next.svg

[InputPanel/ShadowMargin]
# 面板投影留白
Left=12
Right=12
Top=12
Bottom=12

[Menu/Background]
Color=#FFFFFF
BorderColor=#E5E5E5
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/TextMargin]
Left=8
Right=8
Top=6
Bottom=6

[Menu/NormalColor]
# 菜单普通项颜色 #353535
NormalColor=#353535

[Menu/HighlightCandidateColor]
# 菜单选中项文字颜色：白
HighlightCandidateColor=#FFFFFF

[Menu/Highlight]
# 菜单选中项背景：微信绿
Color=#07C160
BorderColor=#00000000
BorderWidth=0

[Menu/Highlight/Margin]
Left=4
Right=4
Top=2
Bottom=2

[Menu/Separator]
Color=#E5E5E5

[Menu/Spacing]
Spacing=3
