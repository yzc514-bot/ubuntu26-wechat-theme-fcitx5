[Metadata]
Name=WeChat Dark
Name[zh_CN]=微信深色
Version=1
Author=ubuntu26
Description=WeChat-inspired dark theme for fcitx5 (green accent, rounded panel)
Description[zh_CN]=仿微信深色主题：微信绿选中态、圆角候选面板
ScaleWithDPI=True

[InputPanel]
Font=Noto Sans CJK SC 14
# 普通候选词颜色：微信深色正文 #DEDEDE
NormalColor=#DEDEDE
# 预编辑颜色：微信绿
HighlightColor=#07C160
# 预编辑背景：深色下的浅绿暗调
HighlightBackgroundColor=#123524
# 选中候选词文字颜色：白
HighlightCandidateColor=#FFFFFF
# 序号标签颜色：微信深色次要文字 #7D7D7D
CandidateLabelColor=#7D7D7D
# 选中态序号标签颜色：白
HighlightCandidateLabelColor=#FFFFFF
# 候选注释颜色
CandidateCommentColor=#7D7D7D
# 选中态注释颜色
HighlightCandidateCommentColor=#D9F2E4
LabelTextSizeFactor=80
CommentTextSizeFactor=75
FullWidthHighlight=True
PageButtonAlignment=Center

[InputPanel/TextMargin]
Left=10
Right=10
Top=6
Bottom=6

[InputPanel/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/Background]
Image=panel.svg
Color=#191919
BorderColor=#2C2C2C
BorderWidth=1

[InputPanel/Background/Margin]
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/Highlight]
Image=highlight.svg
Color=#07C160
BorderColor=#00000000
BorderWidth=0

[InputPanel/Highlight/Margin]
# 高亮九宫格边界：与 highlight.svg 的圆角半径（8px）严格一致
Left=8
Right=8
Top=8
Bottom=8

[InputPanel/HighlightClickMargin]
Left=3
Right=3
Top=1
Bottom=1

[InputPanel/PrevPage]
Image=prev.svg

[InputPanel/NextPage]
Image=next.svg

[InputPanel/ShadowMargin]
Left=12
Right=12
Top=12
Bottom=12

[Menu/Background]
Color=#191919
BorderColor=#2C2C2C
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/TextMargin]
Left=8
Right=8
Top=6
Bottom=6

[Menu/NormalColor]
NormalColor=#DEDEDE

[Menu/HighlightCandidateColor]
HighlightCandidateColor=#FFFFFF

[Menu/Highlight]
Color=#07C160
BorderColor=#00000000
BorderWidth=0

[Menu/Highlight/Margin]
Left=4
Right=4
Top=2
Bottom=2

[Menu/Separator]
Color=#2C2C2C

[Menu/Spacing]
Spacing=3
