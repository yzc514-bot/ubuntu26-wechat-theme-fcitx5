<?xml version="1.0" encoding="UTF-8"?>
<!-- 候选面板圆角背景（九宫格）。深色版：面板 #191919，边框 #2C2C2C。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="55" height="55" rx="14" ry="14"
        fill="#191919" stroke="#2C2C2C" stroke-width="1" filter="url(#shadow)"/>
</svg>
